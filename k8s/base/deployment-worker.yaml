apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-center-worker
  namespace: rag-center
  labels:
    app.kubernetes.io/name: rag-center
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rag-center
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rag-center
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: worker
          image: ghcr.io/owner/rag-center:IMAGE_TAG
          command: ["rag-center", "worker", "run"]
          envFrom:
            - configMapRef:
                name: rag-center-config
          env:
            - name: RAG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rag-center-secrets
                  key: database-url
            - name: RAG_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: rag-center-secrets
                  key: redis-url
            - name: RAG_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-center-secrets
                  key: llm-api-key
            - name: RAG_MODEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-center-secrets
                  key: model-api-key
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          # Worker 无 HTTP 端口；通过 Celery 远程控制 ping 本节点确认进程可响应。
          # ping 经由 broker 往返，因此 Redis 不可用时探针也会失败。
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - celery -A rag_center.celery_app:celery_app inspect ping -d "celery@$HOSTNAME" --timeout 5
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - celery -A rag_center.celery_app:celery_app inspect ping -d "celery@$HOSTNAME" --timeout 5
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
