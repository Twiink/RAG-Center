apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rag-center-api
  namespace: rag-center
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rag-center-api
  # 最小副本数由 overlay 覆盖（dev:1, prod:2）
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # CPU 使用率超过 70% 时触发扩容
          averageUtilization: 70
