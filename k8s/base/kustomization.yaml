apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rag-center

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment-api.yaml
  - deployment-worker.yaml
  - deployment-scheduler.yaml
  - service-api.yaml
  - hpa-api.yaml
  - network-policy.yaml

# 所有资源统一打标签
commonLabels:
  app.kubernetes.io/part-of: rag-center
  app.kubernetes.io/managed-by: kustomize

images:
  - name: ghcr.io/owner/rag-center
    newTag: IMAGE_TAG
