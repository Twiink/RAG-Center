name: CD

on:
  push:
    branches: [master]
    tags: ["v*"]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false  # 发布不中断

jobs:
  # ── 构建并推送镜像 ────────────────────────────────────────────
  push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=RAG Center
            org.opencontainers.image.description=Modular async RAG backend

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  # ── 签名（可选，需要 cosign）─────────────────────────────────
  # sign:
  #   name: Sign image
  #   needs: push
  #   runs-on: ubuntu-latest
  #   permissions:
  #     packages: write
  #     id-token: write
  #   steps:
  #     - uses: sigstore/cosign-installer@v3
  #     - run: cosign sign --yes ghcr.io/${{ github.repository }}@${{ needs.push.outputs.digest }}

  # ── Kubernetes 部署（需配置 KUBE_CONFIG secret 后启用）────────
  # 使用 kustomize 更新 prod overlay 镜像 tag 并应用到集群。
  # 启用方式：在仓库 Secrets 中添加 KUBE_CONFIG（base64 encoded kubeconfig）
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: push
    # 仅在 master 分支推送或打 semver tag 时部署；KUBE_CONFIG secret 存在时生效
    if: >
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) &&
      secrets.KUBE_CONFIG != ''
    environment:
      name: production
      url: https://your-rag-center-domain.example.com

    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Extract image tag from push output
        id: tag
        run: |
          # 从 push job 的 tags 输出取第一个（sha-xxxxx）
          TAG=$(echo "${{ needs.push.outputs.image }}" | head -n1 | awk -F: '{print $NF}')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Update image tag in kustomize overlay
        run: |
          cd k8s/overlays/prod
          kustomize edit set image \
            ghcr.io/owner/rag-center=ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}

      - name: Apply to cluster
        run: |
          kustomize build k8s/overlays/prod | kubectl apply -f -

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/rag-center-api -n rag-center --timeout=300s
          kubectl rollout status deployment/rag-center-worker -n rag-center --timeout=300s
