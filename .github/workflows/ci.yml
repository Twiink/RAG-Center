name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.22"
  PYTHON_VERSION: "3.12.14"

jobs:
  # ── 代码质量检查 ─────────────────────────────────────────────
  check:
    name: Lint / Type / Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "Backend/uv.lock"

      - name: Install dependencies
        run: uv sync --locked

      - name: Format check
        run: uv run ruff format --check src/

      - name: Lint
        run: uv run ruff check src/

      - name: Type check
        run: uv run ty check

      - name: Unit tests
        run: uv run pytest tests/ -m "not integration" -q --tb=short

  # ── OpenAPI 契约验证 ──────────────────────────────────────────
  # 生成最新 OpenAPI schema，确保接口定义与后端代码一致。
  # 若 Frontend/ 存在，也验证前端生成类型没有未提交的变更。
  openapi:
    name: OpenAPI Contract
    runs-on: ubuntu-latest
    needs: check

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "Backend/uv.lock"

      - name: Install backend dependencies
        run: uv sync --locked
        working-directory: Backend

      - name: Generate OpenAPI schema
        run: uv run --directory Backend rag-center openapi --output /tmp/openapi.json

      - name: Upload OpenAPI schema as artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: /tmp/openapi.json
          retention-days: 7

      # 若仓库包含 Frontend，检查生成的 schema 与已提交的一致
      - name: Check Frontend/openapi.json is up-to-date
        if: ${{ hashFiles('Frontend/openapi.json') != '' }}
        run: |
          diff /tmp/openapi.json Frontend/openapi.json || {
            echo "OpenAPI schema 已变更但未更新 Frontend/openapi.json"
            echo "请在本地运行 make openapi 并提交生成的文件"
            exit 1
          }

  # ── 前端检查（Frontend/ 目录存在时运行）────────────────────
  frontend:
    name: Frontend Lint / Build
    runs-on: ubuntu-latest
    needs: openapi
    if: ${{ hashFiles('Frontend/package.json') != '' }}

    defaults:
      run:
        working-directory: Frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: "Frontend/.node-version"
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  # ── Docker 镜像构建验证 ────────────────────────────────────────
  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: check

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: rag-center:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            RAG_EXTRAS=langfuse
