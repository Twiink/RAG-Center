# 可观测性扩展：与 docker-compose.yml 叠加使用。
#   docker compose -f Deploy/docker-compose.yml -f Deploy/docker-compose.observability.yml up -d
#
# 包含：OTel Collector（接收 OTLP、转发 Jaeger/Prometheus）、Jaeger、Prometheus、Grafana。
# 启动后访问：Jaeger http://localhost:16686  Grafana http://localhost:3001  Prometheus http://localhost:9091

services:
  # ── OTel Collector：统一接收应用的 OTLP trace/metrics 并分发 ──
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.113.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ../infra/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"   # gRPC OTLP
      - "127.0.0.1:4318:4318"   # HTTP OTLP（应用使用此端口）
      - "127.0.0.1:8889:8889"   # Prometheus exporter（collector 自身指标）
    restart: unless-stopped
    depends_on:
      jaeger:
        condition: service_started

  # ── Jaeger：链路追踪存储与 UI ───────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: memory
      METRICS_STORAGE_TYPE: prometheus
      PROMETHEUS_SERVER_URL: http://prometheus:9090
    ports:
      - "127.0.0.1:16686:16686"   # Jaeger UI
    restart: unless-stopped

  # ── Prometheus：指标采集 ─────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.0.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ../infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../infra/prometheus-alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9091:9090"   # 避免与应用的 9090 冲突
    restart: unless-stopped

  # ── Grafana：可视化看板 ──────────────────────────────────────
  grafana:
    image: grafana/grafana:11.3.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - grafana_data:/var/lib/grafana
      - ../infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3001:3000"
    restart: unless-stopped
    depends_on:
      - prometheus
      - jaeger

  # ── 应用服务覆盖：注入 OTel 端点 ────────────────────────────
  api:
    environment:
      RAG_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      RAG_METRICS_ENABLED: "true"
    depends_on:
      otel-collector:
        condition: service_started

  worker:
    environment:
      RAG_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      RAG_METRICS_ENABLED: "true"
    depends_on:
      otel-collector:
        condition: service_started

volumes:
  prometheus_data:
  grafana_data:
