global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    service: rag-center

rule_files:
  - alerts.yaml

scrape_configs:
  # ── 应用指标（FastAPI /metrics 端点）─────────────────────────
  - job_name: rag-center-api
    static_configs:
      - targets: ["api:8000"]
        labels:
          component: api
    metrics_path: /metrics

  # Worker 无独立 HTTP 端口；如需采集 Worker 指标，
  # 可在 scheduler 触发时通过 pushgateway 推送，或为 Worker 添加独立 metrics server。

  # ── OTel Collector 自身指标 ──────────────────────────────────
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
    metrics_path: /metrics
