x-backend: &backend
  image: rag-center:local
  build:
    context: .
  environment: &backend-env
    RAG_APP_ENV: production
    RAG_DATABASE_URL: postgresql+psycopg://rag:rag@postgres:5432/rag_center
    RAG_REDIS_URL: redis://redis:6379/0
    RAG_CELERY_BROKER_URL: redis://redis:6379/0
    RAG_CELERY_RESULT_BACKEND: redis://redis:6379/1
    RAG_ELASTICSEARCH_URL: http://elasticsearch:9200
    RAG_MODEL_BASE_URL: ${RAG_MODEL_BASE_URL:-https://api.openai.com/v1}
    RAG_MODEL_API_KEY: ${RAG_MODEL_API_KEY:-}
    RAG_LLM_BASE_URL: ${RAG_LLM_BASE_URL:-https://api.deepseek.com/v1}
    RAG_LLM_API_KEY: ${RAG_LLM_API_KEY:-}
    RAG_AUTH_ENABLED: ${RAG_AUTH_ENABLED:-true}
  volumes:
    - uploads:/app/data/uploads
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  init: true
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rag_center
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
    ports: ["127.0.0.1:${RAG_POSTGRES_PORT:-5432}:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U rag -d rag_center"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, "yes"]
    ports: ["127.0.0.1:${RAG_REDIS_PORT:-6379}:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 30
  elasticsearch:
    build:
      context: .
      dockerfile: Dockerfile.elasticsearch
    image: rag-center-elasticsearch:8.17.10-ik
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["127.0.0.1:${RAG_ELASTICSEARCH_PORT:-9200}:9200"]
    volumes: [es_data:/usr/share/elasticsearch/data]
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40
  migrate:
    <<: *backend
    command: [rag-center, migrate]
    restart: "no"
    healthcheck: {disable: true}
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *backend
    ports: ["127.0.0.1:${RAG_API_PORT:-8000}:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      elasticsearch: {condition: service_healthy}
  worker:
    <<: *backend
    command: [rag-center, worker, run]
    healthcheck: {disable: true}
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      elasticsearch: {condition: service_healthy}
  scheduler:
    <<: *backend
    command: [rag-center, scheduler, run]
    healthcheck: {disable: true}
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  model-stub:
    image: rag-center:local
    profiles: [test]
    command: [python, /tests/model_stub.py]
    volumes: [./Backend/tests/support/model_stub.py:/tests/model_stub.py:ro]
    healthcheck: {disable: true}
  langfuse-db:
    image: postgres:16-alpine
    profiles: [langfuse]
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes: [langfuse_db_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 20
  langfuse:
    image: langfuse/langfuse:2
    profiles: [langfuse]
    depends_on:
      langfuse-db: {condition: service_healthy}
    ports: ["127.0.0.1:${RAG_LANGFUSE_PORT:-3000}:3000"]
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-local-development-change-me}
      SALT: ${LANGFUSE_SALT:-local-development-change-me}
      TELEMETRY_ENABLED: "false"
volumes:
  postgres_data:
  redis_data:
  es_data:
  uploads:
  langfuse_db_data:
